<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>102kg→70kg台を達成した90日ダイエットメソッド</title>
<style>
:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --dark:#111827;
  --green:#16a34a;
  --green-bg:#dcfce7;
  --blue:#2563eb;
  --blue-bg:#dbeafe;
  --red:#dc2626;
  --red-bg:#fee2e2;
  --yellow:#ca8a04;
  --yellow-bg:#fef9c3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
}
header{
  background:linear-gradient(135deg,#111827,#374151);
  color:#fff;
  padding:28px 20px;
}
.wrap{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
}
header .wrap{
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:center;
}
h1{margin:0;font-size:28px;letter-spacing:.03em}
h2{font-size:22px;margin:0 0 14px}
h3{font-size:17px;margin:18px 0 10px}
p{margin:6px 0}
header p{color:#d1d5db}
.badge{
  display:inline-flex;
  border:1px solid rgba(255,255,255,.25);
  border-radius:999px;
  padding:8px 12px;
  font-size:13px;
  white-space:nowrap;
}
nav{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(244,246,251,.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
  display:flex;
  gap:8px;
  padding:10px 0;
  overflow:auto;
}
nav a{
  text-decoration:none;
  color:var(--text);
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  padding:9px 14px;
  font-weight:800;
  font-size:14px;
  white-space:nowrap;
}
main{
  width:min(1180px,calc(100% - 32px));
  margin:18px auto 50px;
}
.section{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 14px 35px rgba(17,24,39,.06);
}
.sub{color:var(--muted);margin-top:-8px;margin-bottom:16px}
